[package]
name = "context-lint"
version = "0.1.0"
edition = "2021"
description = "Fast cross-platform linter for AI coding agent context files (CLAUDE.md, AGENTS.md, GEMINI.md, Cursor rules, skills, and MCP bloat)."
license = "Apache-2.0"
readme = "README.md"
keywords = ["ai", "agents", "linter", "mcp", "claude"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.13"
